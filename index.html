<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Image Gallery</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Tuỳ chỉnh chiều cao và hiệu ứng hiển thị cho ảnh */
        .gallery-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .gallery-img:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="text-center mb-4 text-primary fw-bold">Responsive Image Gallery</h1>
        <p class="text-center text-muted mb-5">Thực hành sử dụng hệ thống Bootstrap Grid System</p>

        <!-- Lưới Gallery Ảnh -->
        <div class="row g-4">
            <!-- Ảnh 1 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm">
                    <img src="https://picsum.photos/id/1015/600/400" class="gallery-img card-img-top" alt="Gallery Image 1">
                    <div class="card-body text-center">
                        <h5 class="card-title h6 mb-0">Mountain View</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 2 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm">
                    <img src="https://picsum.photos/id/1016/600/400" class="gallery-img card-img-top" alt="Gallery Image 2">
                    <div class="card-body text-center">
                        <h5 class="card-title h6 mb-0">Sunset Lake</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 3 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm">
                    <img src="https://picsum.photos/id/1018/600/400" class="gallery-img card-img-top" alt="Gallery Image 3">
                    <div class="card-body text-center">
                        <h5 class="card-title h6 mb-0">Nature Forest</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 4 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm">
                    <img src="https://picsum.photos/id/1019/600/400" class="gallery-img card-img-top" alt="Gallery Image 4">
                    <div class="card-body text-center">
                        <h5 class="card-title h6 mb-0">Ocean Waves</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 5 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm">
                    <img src="https://picsum.photos/id/1025/600/400" class="gallery-img card-img-top" alt="Gallery Image 5">
                    <div class="card-body text-center">
                        <h5 class="card-title h6 mb-0">Wild Animal</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 6 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm">
                    <img src="https://picsum.photos/id/1039/600/400" class="gallery-img card-img-top" alt="Gallery Image 6">
                    <div class="card-body text-center">
                        <h5 class="card-title h6 mb-0">Waterfall</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 7 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm">
                    <img src="https://picsum.photos/id/1043/600/400" class="gallery-img card-img-top" alt="Gallery Image 7">
                    <div class="card-body text-center">
                        <h5 class="card-title h6 mb-0">Autumn Road</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 8 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm">
                    <img src="https://picsum.photos/id/1050/600/400" class="gallery-img card-img-top" alt="Gallery Image 8">
                    <div class="card-body text-center">
                        <h5 class="card-title h6 mb-0">Blue Coast</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
